# Static site: no build step. Netlify publishes the repository root.
[build]
  publish = "."

[[headers]]
  for = "/kits.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
